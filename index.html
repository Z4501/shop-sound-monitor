<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit D · Two camera sound monitor</title><style>body{margin:0;background:#0c141e;color:#edf4fa;font-family:Segoe UI,Arial}header{padding:22px 32px 0}h1{font-size:25px;margin:0}p{color:#a5b6c7}main{display:grid;grid-template-columns:1fr 1fr}iframe{width:100%;height:1120px;border:0}@media(max-width:1100px){main{grid-template-columns:1fr}}</style></head><body><header><h1>Unit D · Sound monitor</h1><p>Two camera readings · Periodic updates · Matching chart scales · Eastern time</p></header><main><iframe title="Original shop camera" src="panel.html?camera=shop"></iframe><iframe title="Back Door camera by bench" src="panel.html?camera=back"></iframe></main><script>window.addEventListener('message',e=>{if(e.origin===location.origin&&['300','900','3600'].includes(e.data?.range))document.querySelectorAll('iframe').forEach(f=>f.contentWindow.postMessage(e.data,location.origin))})</script></body></html>
